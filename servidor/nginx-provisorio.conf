# TeAtende — Nginx PROVISÓRIO (só HTTP), usado uma vez para o certbot emitir o certificado.
# Depois de emitir, troque por servidor/nginx.conf (versão final com HTTPS).
server {
    listen 80;
    listen [::]:80;
    server_name rbitecnologia.com.br www.rbitecnologia.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        root /var/www/rbitecnologia;
        index index.html;
    }
}
