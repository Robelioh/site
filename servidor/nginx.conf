# TeAtende — Nginx (HTTPS, www -> sem www, cache, compressão, 404)
# Instalar em:  /etc/nginx/sites-available/rbitecnologia.com.br  (e linkar em sites-enabled)
# Raiz do site: /var/www/rbitecnologia
# O certificado vem do Let's Encrypt (certbot); veja o passo a passo no README.
# Este arquivo só pode ser ativado DEPOIS que o certificado existir (senão `nginx -t` falha).
# Se o seu servidor não tiver IPv6, apague as linhas "listen [::]:...".

# HTML/CSS/JS: o navegador sempre confere se mudou (304, barato). Os arquivos não têm hash no nome,
# então cache longo faria visitantes antigos ficarem com JS velho após uma atualização.
# Fontes e imagens quase nunca mudam: cache longo.
map $uri $teatende_cache {
    default                         "no-cache";
    ~*\.woff2$                      "public, max-age=31536000, immutable";
    ~*\.(webp|png|jpe?g|svg|ico)$   "public, max-age=2592000";
}

# HTTP: só o desafio do Let's Encrypt e o redirecionamento para HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name rbitecnologia.com.br www.rbitecnologia.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://rbitecnologia.com.br$request_uri;
    }
}

# HTTPS com www -> sem www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.rbitecnologia.com.br;

    ssl_certificate     /etc/letsencrypt/live/rbitecnologia.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rbitecnologia.com.br/privkey.pem;

    return 301 https://rbitecnologia.com.br$request_uri;
}

# O site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rbitecnologia.com.br;

    ssl_certificate     /etc/letsencrypt/live/rbitecnologia.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rbitecnologia.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/rbitecnologia;
    index index.html;
    charset utf-8;

    # Compressão (text/html já vem ligado por padrão)
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/css text/javascript application/javascript application/json application/ld+json application/xml text/xml text/plain image/svg+xml;

    # Cabeçalhos (declarados só aqui: o Nginx não herda add_header se um location declarar outro)
    add_header Cache-Control $teatende_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS: ative só quando o HTTPS estiver estável (é difícil de desfazer).
    # add_header Strict-Transport-Security "max-age=31536000" always;

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Esconde arquivos ocultos (.git, .htaccess etc.)
    location ~ /\.(?!well-known) { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
